route:                                         
  receiver: rca-agent                          
  group_by: []                                 
  group_wait: 30s                             
  group_interval: 1m                           
  repeat_interval: 4h                          

receivers:
  - name: rca-agent                            
    webhook_configs:
      - url: http://webhook-debug:8080/alerts  
        send_resolved: true
      - url: http://host.docker.internal:8001/alerts   # NEW: the RCA agent API in WSL
        send_resolved: true