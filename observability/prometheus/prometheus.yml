global:                        
  scrape_interval: 15s          
  evaluation_interval: 15s    

rule_files:                                        
  - /etc/prometheus/rules/*.yml  

scrape_configs:                 
  - job_name: shop-api         
    static_configs:             
      - targets: ["shop-api:8000"]  

  - job_name: prometheus        
    static_configs:
      - targets: ["localhost:9090"] 

  - job_name: postgres          
    static_configs:
      - targets: ["postgres-exporter:9187"]   

  - job_name: redis             
    static_configs:
      - targets: ["redis-exporter:9121"]

 