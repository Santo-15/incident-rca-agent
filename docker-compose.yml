#Describes the whole shop stack; start it with: docker compose up -d
name: incident-rca-agent
services:                           
  postgres:                         
    image: postgres:16              
    environment:                    
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"       
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]   
      interval: 5s          
      timeout: 3s           
      retries: 5            
      start_period: 10s     
    restart: unless-stopped    

  redis:                            # NEW  DNS name redis; holds carts
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # AOF on: carts survive restarts
    ports:
      - "127.0.0.1:6379:6379"      
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  shop-api:
    build: ./shop
    image: shop-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}             # :-20 = use 20 if missing
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]   # shallow liveness; slim image has no curl, so use Python
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  locust:                                        
    image: locustio/locust:2.46.7                
    volumes:
      - ./traffic:/mnt/locust:ro                
    command:                                     
      - "-f"                                     
      - "/mnt/locust/locustfile.py"             
      - "--host"                                 
      - "http://shop-api:8000"                   
      - "--autostart"                            
      - "-u"                                     
      - "${LOCUST_USERS:-10}"                    
      - "-r"                                     
      - "${LOCUST_SPAWN_RATE:-2}"                
    ports:
      - "127.0.0.1:8089:8089"                    
    depends_on:
      shop-api:
        condition: service_healthy               
    restart: unless-stopped

  prometheus:                                   
    image: prom/prometheus:v3.13.4              
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro  
      - promdata:/prometheus
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro                   
    command:                                    
      - "--config.file=/etc/prometheus/prometheus.yml"   
      - "--storage.tsdb.path=/prometheus"        
      - "--storage.tsdb.retention.time=7d"       
      - "--web.enable-lifecycle"                 
    ports:
      - "127.0.0.1:9090:9090"                   
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]   
      interval: 10s                             
      timeout: 3s                                
      retries: 3                                 
    restart: unless-stopped            

  postgres-exporter:                            
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1   
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable   
    restart: unless-stopped 

  redis-exporter:                               
    image: oliver006/redis_exporter:v1.92.1      
    environment:
      REDIS_ADDR: redis://redis:6379             
    restart: unless-stopped

  loki:                                          
    image: grafana/loki:3.7.8                    
    command: ["-config.file=/etc/loki/loki-config.yaml"]   
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro   
      - lokidata:/loki                          
    ports:
      - "127.0.0.1:3100:3100"                    
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]  
      interval: 10s                              
      timeout: 3s                               
      retries: 5                                 
      start_period: 20s                          
    restart: unless-stopped                      

  alloy:                                         
    image: grafana/alloy:v1.20.1                 
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]   # NEW: run our config; UI on 12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro   
      - /var/run/docker.sock:/var/run/docker.sock:ro   
      - alloydata:/var/lib/alloy/data            
    ports:
      - "127.0.0.1:12345:12345"                 
    restart: unless-stopped                                         
  grafana:                                      
    image: grafana/grafana:13.2.4                
    environment:
      GF_SECURITY_ADMIN_USER: admin                                                        
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}   
      GF_USERS_ALLOW_SIGN_UP: "false"            
      GF_ANALYTICS_REPORTING_ENABLED: "false"    
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"    
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro   
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro       
      - grafanadata:/var/lib/grafana             
    ports:
      - "127.0.0.1:3000:3000"                    
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]   
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s                          
    restart: unless-stopped
volumes:
  pgdata:                           
    external: true                  
    name: shop-pgdata 
  redisdata: {}
  promdata: {}
  lokidata: {}
  alloydata: {}
  grafanadata: {}