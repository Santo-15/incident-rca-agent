#Describes the whole shop stack; start it with: docker compose up -d
name: incident-rca-agent
services:                           
  postgres:                         
    image: postgres:16              
    environment:                    
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"       
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]   
      interval: 5s          
      timeout: 3s           
      retries: 5            
      start_period: 10s     
    restart: unless-stopped    

  redis:                            # NEW  DNS name redis; holds carts
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]   # AOF on: carts survive restarts
    ports:
      - "127.0.0.1:6379:6379"      
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  shop-api:
    build: ./shop
    image: shop-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}             # :-20 = use 20 if missing
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-86400}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]   # shallow liveness; slim image has no curl, so use Python
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:                           
    external: true                  
    name: shop-pgdata 
  redisdata: {}